spring.application.name=tasktracker

# MySQL (the database is created on first start if it does not exist)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tasktracker?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: the secret must be at least 32 characters. Override it outside development.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-hours=10

# First SUPPORT account, created only when the users table is empty
app.seed.support-username=${SUPPORT_USERNAME:support}
app.seed.support-password=${SUPPORT_PASSWORD:support123}
